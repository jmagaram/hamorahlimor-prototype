<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phone frame — 360×750</title>
    <style>
      html, body { margin: 0; background: #ddd; }
      body { display: flex; min-height: 100vh; padding: 8px; box-sizing: border-box; }
      .phone { margin: auto; }
      .phone {
        width: 360px;
        height: 750px;
        border: 12px solid #222;
        border-radius: 36px;
        overflow: hidden;
        background: #fff;
        flex: none;
      }
      iframe { width: 360px; height: 750px; border: 0; display: block; }
    </style>
  </head>
  <body>
    <div class="phone"><iframe src="/" title="Teacher prototype"></iframe></div>
  </body>
</html>
